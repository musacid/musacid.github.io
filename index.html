    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary-gold: #d4ac0d;
            --dark-blue: #141e30;
            --royal-blue: #0f2027;
            --light-bg: #f4f7f6;
            --whatsapp-green: #25D366;
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--light-bg);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Navbar */
        .custom-navbar {
            background: linear-gradient(to left, #000000, #434343);
            border-bottom: 3px solid var(--primary-gold);
        }
        .nav-link { color: #fff !important; transition: 0.3s; margin: 0 5px; }
        .nav-link:hover { color: var(--primary-gold) !important; transform: translateY(-2px); }
        .nav-link.active { color: var(--primary-gold) !important; font-weight: bold; }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, var(--dark-blue) 0%, #2c3e50 100%);
            color: white;
            padding: 0 0 80px;
            position: relative;
            overflow: hidden;
        }

        .planning-strip {
            background: rgba(255,255,255,0.05);
            height: 50px;
            width: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 60px;
        }
        .ticker-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .ticker { display: inline-block; animation: marquee 30s linear infinite; }
        .ticker-item { display: inline-block; padding: 0 2rem; font-size: 0.9rem; color: #ccc; }
        .ticker-item i { color: var(--primary-gold); margin-left: 5px; }
        
        @keyframes marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(50%, 0, 0); }
        }

        /* شريط الصور المتحرك الجديد */
        .image-slider-container {
            width: 100%;
            overflow: hidden;
            background: #ffffff;
            padding: 20px 0;
            white-space: nowrap;
            direction: ltr;
            border-bottom: 3px solid var(--primary-gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .image-slide-track {
            display: inline-block;
            animation: image-scroll 35s linear infinite;
        }
        .image-slide-track:hover {
            animation-play-state: paused;
        }
        .image-slide-track img {
            height: 160px;
            margin: 0 10px;
            border-radius: 12px;
            border: 2px solid #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover;
        }
        @keyframes image-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .updates-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            height: 250px;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .updates-box:hover { transform: scale(1.02); border-color: var(--primary-gold); }
